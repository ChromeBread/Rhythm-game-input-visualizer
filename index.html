<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Beatmania IIDX Joystick Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container" style="background-color: #00FF00;">
        <!-- レーン表示 -->
        <div id="lanes">
            <!-- スクラッチ2レーン、鍵盤7レーン、鍵盤7レーン、スクラッチ2レーン -->
            <div class="lane scratch" data-index="0"><input type="text" class="lane-label" value="SCR1"></div>
            <div class="lane key white" data-index="1"><input type="text" class="lane-label" value="KEY1"></div>
            <div class="lane key black" data-index="2"><input type="text" class="lane-label" value="KEY2"></div>
            <!-- 以下、残りのレーンを同様に追加 -->
        </div>
        <!-- 設定パネル -->
        <div id="settings">
            <label>FPS: 
                <button onclick="setFPS(30)">30 FPS</button>
                <button onclick="setFPS(60)">60 FPS</button>
            </label>
            <label>緑数字: 
                <input type="range" id="greenNumber" min="50" max="500" value="300">
                <input type="number" id="greenNumberInput" value="300">
            </label>
            <label>レーンカラー:
                <input type="color" id="scratchColor" value="#000000">
                <input type="color" id="whiteKeyColor" value="#808080">
                <input type="color" id="blackKeyColor" value="#000000">
            </label>
            <button onclick="exportSettings()">エクスポート</button>
            <input type="file" id="importFile" accept=".txt">
            <button onclick="resetSettings()">リセット</button>
        </div>
    </div>
    <canvas id="noteCanvas"></canvas>
    <script src="script.js"></script>
</body>
</html>
