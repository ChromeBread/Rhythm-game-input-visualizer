<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IIDX Input Visualizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="visualizer-container">
    <!-- レーン -->
    <div id="lanes"></div>
    <!-- コントロールパネル -->
    <div id="controls">
      <div>
        <label>FPS: </label>
        <button onclick="setFps(30)">30 FPS</button>
        <button onclick="setFps(60)">60 FPS</button>
      </div>
      <div>
        <label>緑数字: </label>
        <input type="range" id="greenNumber" min="100" max="600" value="300">
        <input type="number" id="greenNumberInput" min="100" max="600" value="300">
      </div>
      <div>
        <button onclick="exportSettings()">エクスポート</button>
        <input type="file" id="importFile" accept=".txt" onchange="importSettings()">
        <button onclick="confirmReset()">リセット</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
